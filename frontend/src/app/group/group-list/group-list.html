<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Grupos</h1>
  <a class="btn btn-primary" routerLink="/groups/new">Novo grupo</a>
</div>

@if (errorMessage()) {
  <div class="alert alert-danger">{{ errorMessage() }}</div>
}

<app-bulk-actions-bar
  [selectedCount]="selection.selectedCount()"
  entityLabelPlural="grupos"
  (remove)="removeSelected()"
/>

@if (groups().length) {
  <table class="table table-striped">
    <thead>
      <tr>
        <th>
          <input
            type="checkbox"
            [checked]="selection.isAllSelected(groups())"
            (change)="selection.toggleAll(groups())"
          />
        </th>
        <th>Nome</th>
        <th>Integrantes</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (group of groups(); track group.id) {
        <tr>
          <td>
            <input
              type="checkbox"
              [checked]="selection.isSelected(group)"
              (change)="selection.toggle(group)"
            />
          </td>
          <td>{{ group.name }}</td>
          <td>{{ group.members.length }}</td>
          <td class="text-end">
            <app-row-actions [editLink]="['/groups', group.id, 'edit']" (remove)="remove(group)" />
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p class="text-muted">Nenhum grupo cadastrado.</p>
}

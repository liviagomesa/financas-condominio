<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Condôminos</h1>
  <a class="btn btn-primary" routerLink="/residents/new">Novo condômino</a>
</div>

@if (residents().length) {
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Unidade</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (resident of residents(); track resident.id) {
        <tr>
          <td>{{ resident.name }}</td>
          <td>{{ resident.unit.identifier }}</td>
          <td>{{ resident.email || '-' }}</td>
          <td>{{ resident.phone || '-' }}</td>
          <td class="text-end">
            <a
              class="btn btn-sm btn-outline-secondary"
              [routerLink]="['/residents', resident.id, 'edit']"
              >Editar</a
            >
            <button
              type="button"
              class="btn btn-sm btn-outline-danger ms-1"
              (click)="remove(resident)"
            >
              Remover
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p class="text-muted">Nenhum condômino cadastrado.</p>
}

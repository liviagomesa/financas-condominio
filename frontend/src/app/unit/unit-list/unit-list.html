<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Unidades</h1>
  <a class="btn btn-primary" routerLink="/units/new">Nova unidade</a>
</div>

@if (errorMessage()) {
  <div class="alert alert-danger">{{ errorMessage() }}</div>
}

<app-bulk-actions-bar
  [selectedCount]="selection.selectedCount()"
  entityLabelPlural="unidades"
  (remove)="removeSelected()"
/>

@if (units().length) {
  <table class="table table-striped">
    <thead>
      <tr>
        <th>
          <input
            type="checkbox"
            [checked]="selection.isAllSelected(units())"
            (change)="selection.toggleAll(units())"
          />
        </th>
        <th>Identificador</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (unit of units(); track unit.id) {
        <tr>
          <td>
            <input
              type="checkbox"
              [checked]="selection.isSelected(unit)"
              (change)="selection.toggle(unit)"
            />
          </td>
          <td>{{ unit.identifier }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/units', unit.id, 'edit']"
              >Editar</a
            >
            <button
              type="button"
              class="btn btn-sm btn-outline-danger ms-1"
              (click)="remove(unit)"
            >
              Remover
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p class="text-muted">Nenhuma unidade cadastrada.</p>
}

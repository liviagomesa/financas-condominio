<h1 class="h3 mb-3">{{ isEditMode ? 'Editar unidade' : 'Nova unidade' }}</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="col-md-6">
  <div class="mb-3">
    <label for="identifier" class="form-label">Identificador</label>
    <input
      id="identifier"
      type="text"
      class="form-control"
      formControlName="identifier"
      placeholder="Ex.: Bloco A - 101"
    />
    @if (form.controls.identifier.invalid && form.controls.identifier.touched) {
      <div class="text-danger small mt-1">O identificador é obrigatório.</div>
    }
  </div>

  @if (errorMessage()) {
    <div class="alert alert-danger">{{ errorMessage() }}</div>
  }

  <button type="submit" class="btn btn-primary">Salvar</button>
</form>

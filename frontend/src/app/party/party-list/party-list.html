<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Partes</h1>
  <a class="btn btn-primary" routerLink="/parties/new">Nova parte</a>
</div>

@if (errorMessage()) {
  <div class="alert alert-danger">{{ errorMessage() }}</div>
}

<app-bulk-actions-bar
  [selectedCount]="selection.selectedCount()"
  entityLabelPlural="partes"
  (remove)="removeSelected()"
/>

@if (parties().length) {
  <table class="table table-striped">
    <thead>
      <tr>
        <th>
          <input
            type="checkbox"
            class="form-check-input row-select-checkbox"
            [checked]="selection.isAllSelected(parties())"
            (change)="selection.toggleAll(parties())"
          />
        </th>
        <th>Nome</th>
        <th>Chave PIX</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (party of parties(); track party.id) {
        <tr [class.table-active]="selection.isSelected(party)">
          <td>
            <input
              type="checkbox"
              class="form-check-input row-select-checkbox"
              [checked]="selection.isSelected(party)"
              (click)="selection.toggleWithRange(party, parties(), $event.shiftKey)"
            />
          </td>
          <td>{{ party.name }}</td>
          <td>{{ party.pixKey || '-' }}</td>
          <td class="text-end">
            <app-row-actions [editLink]="['/parties', party.id, 'edit']" (remove)="remove(party)" />
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p class="text-muted">Nenhuma parte cadastrada.</p>
}

<a
  class="btn btn-sm btn-outline-secondary"
  [routerLink]="editLink()"
  title="Editar"
  aria-label="Editar"
>
  <i class="bi bi-pencil" aria-hidden="true"></i>
</a>
<button
  type="button"
  class="btn btn-sm btn-outline-danger ms-1"
  title="Remover"
  aria-label="Remover"
  (click)="remove.emit()"
>
  <i class="bi bi-trash" aria-hidden="true"></i>
</button>

@if (selectedCount() > 0) {
  <div class="d-flex align-items-center justify-content-between alert alert-secondary py-2 px-3 mb-3">
    <span>{{ selectedCount() }} {{ entityLabelPlural() }} selecionado(s)</span>
    <div class="d-flex gap-2">
      @if (showDuplicateActions()) {
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="duplicate.emit()">
          Duplicar para o mês seguinte
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="duplicateZeroed.emit()">
          Duplicar para o mês seguinte (valor zerado)
        </button>
      }
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="confirmAndRemove()">
        Remover selecionados
      </button>
    </div>
  </div>
}

services:
  postgres:
    image: postgres:18.4
    container_name: financas-postgres
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
    # Porta 5434 no host (não 5432, ocupada por um PostgreSQL nativo já
    # instalado na máquina; nem 5433, que passou a ser interceptada por um
    # port-forward do VS Code nesta máquina).
    ports:
      - "5434:5432"
    volumes:
      - financas-postgres-data:/var/lib/postgresql

volumes:
  financas-postgres-data:
